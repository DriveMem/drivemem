services:
  postgres:
    image: postgres:16
    container_name: aidrive-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: aidrive
      POSTGRES_USER: aidrive
      POSTGRES_PASSWORD: aidrive_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aidrive']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: aidrive-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aidrive-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aidrive-qdrant
    ports:
      - '6333:6333'
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
