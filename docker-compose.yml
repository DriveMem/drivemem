services:
  postgres:
    image: postgres:16
    container_name: aidrive-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: aidrive
      POSTGRES_USER: aidrive
      POSTGRES_PASSWORD: aidrive_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aidrive']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: aidrive-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
