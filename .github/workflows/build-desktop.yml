name: Build Desktop Client

on:
  push:
    paths:
      - 'packages/desktop/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact: "packages/desktop/dist/*.dmg"
          - os: windows-latest
            target: win
            artifact: "packages/desktop/dist/*.exe"
          - os: ubuntu-latest
            target: linux
            artifact: "packages/desktop/dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build desktop
        working-directory: packages/desktop
        run: npx electron-builder --${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DriveMem-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
          if-no-files-found: ignore

      - name: Create GitHub Release (draft)
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.0-${{ matrix.target }}
          name: DriveMem Desktop v0.1.0 (${{ matrix.target }})
          draft: true
          files: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
