name: Build Desktop Client

on:
  push:
    paths:
      - 'packages/desktop/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact: "packages/desktop/dist/*.dmg"
          - os: windows-latest
            target: win
            artifact: "packages/desktop/dist/*.exe"
          - os: ubuntu-latest
            target: linux
            artifact: "packages/desktop/dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: packages/desktop
        run: npm install

      - name: Build
        working-directory: packages/desktop
        run: npx electron-builder --${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriveMem-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
          if-no-files-found: ignore
